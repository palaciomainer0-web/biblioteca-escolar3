<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Escolar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-4">
<h1 class="text-center mb-4">Biblioteca Escolar</h1>
  <div class="card p-3 mb-4">

<h4>Agregar Libro</h4>

<input
id="titulo"
class="form-control mb-2"
placeholder="Título">

<input
id="autor"
class="form-control mb-2"
placeholder="Autor">

<select
id="categoria"
class="form-select mb-2">

<option>Ficción</option>
<option>No ficción</option>
<option>Ciencia</option>
<option>Tecnología</option>
<option>Historia</option>

</select>

<button
class="btn btn-primary"
onclick="agregarLibro()">

Agregar Libro

</button>

</div>

<button class="btn btn-dark mb-3" onclick="cambiarTema()">Tema Claro/Oscuro</button>

<div class="row mb-3">
<div class="col-md-4">
<input id="searchFilter" class="form-control" placeholder="Buscar libro">
</div>
<div class="col-md-3">
<select id="availabilityFilter" class="form-select">
<option value="all">Todos</option>
<option value="available">Disponibles</option>
<option value="borrowed">Prestados</option>
</select>
</div>
<div class="col-md-3">
<select id="categoryFilter" class="form-select">
<option value="all">Todas las categorías</option>
<option>Ficción</option>
<option>No ficción</option>
<option>Ciencia</option>
<option>Tecnología</option>
</select>
</div>
</div>

<div id="libros" class="row"></div>

<hr>
<h3>Reporte de libros más leídos</h3>
<div id="reporteLibros"></div>

<hr>
<canvas id="grafico"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
